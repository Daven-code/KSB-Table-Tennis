name: Update KSB current-season data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update current teams, players and league tables
        run: python update_ksb_database.py

      - name: Update opposition enrichment
        run: python update_ksb_opposition_database.py

      - name: Commit refreshed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ksb_master_database.json league-history.json ksb_opposition_database.json ksb_opposition_api_cache.json
          git diff --cached --quiet || git commit -m "Automatically update current-season data"
          git push
