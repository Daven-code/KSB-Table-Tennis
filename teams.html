<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teams - KSB Table Tennis Club</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { color: #f0f0f0; background-color: #121212; }
  body::before { content: ""; position: fixed; top:0; left:0; right:0; bottom:0; background-color: rgba(18,18,18,0.85); z-index:-1; }
  .team-btn { background-color: #2c2c2c; color: #f0f0f0; border: 1px solid #444; border-radius: 8px; padding: 15px 20px; display: block; text-decoration: none; transition: all 0.3s ease; }
  .team-btn:hover { background-color: #444; color: #66b3ff; transform: scale(1.05); }
  .card { background-color: #1e1e1e; border: none; }
  .team-season-label { color:#b9c3cc; margin-top:-10px; margin-bottom:4px; }
  .team-list-loading, .team-list-error { padding:24px; color:#b9c3cc; }
  .team-list-error { color:#ffb6b6; }
</style>
</head>
<body>

<!-- Navbar automatically inserted by site-utils.js -->

<div class="container text-center mt-5">
  <h1 class="mb-4">Select Your Team</h1>

  <!-- Team groupings are loaded from teams-config.json. -->
  <p id="teamSeasonLabel" class="team-season-label"></p>
  <div class="mb-4"><a class="btn btn-primary px-4 py-2" href="players.html">All Players</a></div>
  <div id="teamDivisionGroups">
    <div class="team-list-loading">Loading current team divisions...</div>
  </div>

  <!-- Weekly Fixtures -->
  <h3 class="text-start mb-3 mt-5">This Week's Fixtures</h3>
  <div class="card p-3 mt-3">
    <div class="table-responsive">
      <table id="weeklyFixturesTable" class="table table-dark table-striped table-hover text-center align-middle">
        <thead>
          <tr>
            <th>Date</th>
            <th>Home</th>
            <th>Away</th>
            <th>Venue</th>
          </tr>
        </thead>
        <tbody id="weeklyFixturesBody">
          <tr><td colspan="4"><em>Loading fixtures...</em></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div> <!-- container -->

<script src="site-utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ===========================
// Weekly Fixtures Loader
// ===========================

// List of team fixture files to include
const teams = [
  "KSB A", "KSB B", "KSB C", "KSB D", "KSB E",
  "KSB F", "KSB Lions", "KSB Tigers",
  "KSB G", "KSB Jaguars", "KSB Leopards",
  "KSB Pumas", "KSB Panthers"
];

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  })[char]);
}

function divisionHeading(key) {
  return ({ premier:"Premier Division", first:"First Division", second:"Second Division", third:"Third Division" })[key] || key;
}

async function loadTeamDivisions() {
  const host = document.getElementById("teamDivisionGroups");
  try {
    const response = await fetch("teams-config.json", { cache:"no-cache" });
    if (!response.ok) throw new Error(`Could not load teams-config.json (${response.status}).`);
    const config = await response.json();
    const season = String(config.currentSeason);
    const seasonConfig = config.seasons?.[season];
    if (!seasonConfig) throw new Error(`No team configuration found for ${season}.`);

    document.getElementById("teamSeasonLabel").textContent = `${seasonConfig.label || season} season`;
    host.innerHTML = Object.entries(seasonConfig.divisions).map(([divisionKey, divisionTeams]) => `
      <section class="team-division-group">
        <h3 class="text-start mb-3 mt-4">${divisionHeading(divisionKey)}</h3>
        <div class="row g-3">
          ${divisionTeams.map(team => `
            <div class="col-6 col-md-3">
              <a class="team-btn py-2 px-3" href="${escapeHtml(config.teamFiles[team])}">${escapeHtml(team)}</a>
            </div>`).join("")}
        </div>
      </section>`).join("");
  } catch (error) {
    host.innerHTML = `<div class="team-list-error">${escapeHtml(error.message)}</div>`;
  }
}

function parseCSV(text) {
  const rows = text.trim().split("\n");
  const headers = rows.shift().split(",");
  return rows.map(row => {
    const values = row.split(",");
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = values[i]?.trim());
    return obj;
  });
}

function isThisWeek(date) {
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7)); // Monday
  monday.setHours(0,0,0,0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23,59,59,999);
  return date >= monday && date <= sunday;
}

async function loadWeeklyFixtures() {
  const allFixtures = [];
  for (const team of teams) {
    const file = `${team} Fixtures.csv`.replaceAll(" ", "%20");
    try {
      const res = await fetch(file);
      if (!res.ok) continue;
      const text = await res.text();
      const data = parseCSV(text);
      data.forEach(fix => {
        const date = new Date(fix.Date);
        if (isThisWeek(date)) allFixtures.push(fix);
      });
    } catch (err) {
      console.warn(`Error loading ${file}:`, err);
    }
  }

  const tbody = document.getElementById("weeklyFixturesBody");
  tbody.innerHTML = "";

  if (allFixtures.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4"><em>No fixtures scheduled this week.</em></td></tr>`;
    return;
  }

  // Remove duplicates (e.g. when two KSB teams play each other)
const uniqueFixtures = [];
const seen = new Set();

for (const f of allFixtures) {
  const key = `${f.Date}|${f["Home Team"]}|${f["Away Team"]}|${f.Venue}`;
  if (!seen.has(key)) {
    seen.add(key);
    uniqueFixtures.push(f);
  }
}

// Sort by date
uniqueFixtures.sort((a, b) => new Date(a.Date) - new Date(b.Date));

// Display fixtures
uniqueFixtures.forEach(f => {
  const dateStr = new Date(f.Date).toLocaleDateString("en-GB", {
    day: "2-digit", month: "short", year: "numeric"
  });
  const row = document.createElement("tr");
  row.innerHTML = `
    <td>${dateStr}</td>
    <td>${f["Home Team"]}</td>
    <td>${f["Away Team"]}</td>
    <td>${f.Venue}</td>
  `;
  tbody.appendChild(row);
});
}

document.addEventListener("DOMContentLoaded", () => {
  loadTeamDivisions();
  loadWeeklyFixtures();
});
</script>
</body>
</html>
