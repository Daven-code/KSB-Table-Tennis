<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KSB Table Tennis Club - KSB Panthers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="team-styles.css" rel="stylesheet">
</head>
<body>
  <main class="container team-page my-5">
    <h1 class="mb-4">KSB Panthers</h1>
    <ul class="nav nav-tabs" id="teamTabs" role="tablist">
      <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#fixtures" type="button">Fixtures</button></li>
      <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#members" type="button">Team Members</button></li>
      <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#league" type="button">League Table</button></li>
    </ul>
    <div class="tab-content team-shell p-3 mt-3">
      <section class="tab-pane fade show active" id="fixtures">
        <h2 class="section-heading">Upcoming Fixtures</h2>
        <div class="table-responsive"><table id="upcomingTable" class="table table-dark table-striped table-hover align-middle"></table></div>
        <h2 class="section-heading mt-4">Past Fixtures</h2>
        <div class="table-responsive"><table id="pastTable" class="table table-dark table-striped align-middle"></table></div>
      </section>
      <section class="tab-pane fade" id="members">
        <div class="team-members-toolbar"><h2 class="section-heading mb-0">Team Members</h2><span class="small-note">Season follows the League Table selection</span></div>
        <div id="teamMembersContent" class="status-panel">Player statistics will appear here when the feed is connected.</div>
      </section>
      <section class="tab-pane fade" id="league">
        <div class="league-toolbar">
          <h2 id="leagueHeading" class="section-heading mb-0">Third Division Table</h2>
          <div class="season-control">
            <label for="seasonSelect">Season</label>
            <select id="seasonSelect" class="form-select form-select-sm" aria-label="Select league table season">
              <option value="2026">2026</option>
              <option value="2025" selected>2025</option>
              <option value="2024">2024</option>
              <option value="2023">2023</option>
              <option value="2022">2022</option>
              <option value="2021">2021</option>
              <option value="2020">2020</option>
              <option value="2019">2019</option>
              <option value="2018">2018</option>
              <option value="2017">2017</option>
              <option value="2016">2016</option>
              <option value="2015">2015</option>
              <option value="2014">2014</option>
              <option value="2013">2013</option>
            </select>
          </div>
        </div>
        <div id="leagueContent" class="status-panel"><div><div class="spinner-border text-primary mb-3" role="status"></div><p>Loading league table...</p></div></div>
      </section>
    </div>
  </main>
  <script>const teamName='KSB Panthers';</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="team-template.js"></script>
  <script src="site-utils.js"></script>
</body>
</html>
