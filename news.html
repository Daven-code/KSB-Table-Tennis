<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>News - KSB Table Tennis Club</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      color: #f0f0f0;
      background-color: #121212;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(18, 18, 18, 0.85);
      z-index: -1;
    }

    .card {
      background-color: #1e1e1e;
      border: none;
    }

    .news-item {
      background-color: #1e1e1e;
      border-left: 4px solid #66b3ff;
      padding: 20px;
      margin-bottom: 22px;
      border-radius: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
    }

    .news-item:hover {
      background-color: #252525;
      transform: translateY(-2px);
    }

    .news-date {
      font-size: 0.9rem;
      color: #999;
      margin-bottom: 5px;
    }

    .news-title {
      color: #ffffff;
      margin-bottom: 15px;
    }

    .news-content {
      line-height: 1.65;
    }

    .featured-news {
      border-left-color: #ffd166;
      background: linear-gradient(135deg, #1f1f1f 0%, #222b36 100%);
    }

    .featured-badge {
      display: inline-block;
      background: rgba(255, 209, 102, 0.15);
      color: #ffd166;
      border: 1px solid rgba(255, 209, 102, 0.4);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.8rem;
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .lead-news {
      font-size: 1.05rem;
      color: #e8e8e8;
      line-height: 1.7;
    }

    .result-card {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 15px;
      height: 100%;
    }

    .result-card h6 {
      color: #66b3ff;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .result-card ul {
      padding-left: 18px;
      margin-bottom: 0;
    }

    .result-card li {
      margin-bottom: 6px;
    }

    .winner-panel {
      background: rgba(255, 209, 102, 0.10);
      border: 1px solid rgba(255, 209, 102, 0.28);
      border-radius: 14px;
      padding: 18px;
      margin: 18px 0;
    }

    .winner-panel h6 {
      color: #ffd166;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .section-heading {
      margin-top: 22px;
      margin-bottom: 10px;
      color: #ffffff;
      font-weight: 700;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background-color: #111;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      min-height: 150px;
      padding: 0;
      width: 100%;
      color: inherit;
      text-align: left;
    }

    .gallery-item img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .gallery-item:hover img,
    .gallery-item:hover .video-placeholder {
      transform: scale(1.04);
      opacity: 0.92;
    }

    .gallery-label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.62);
      color: #fff;
      font-size: 0.78rem;
      padding: 4px 8px;
      border-radius: 999px;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .video-placeholder {
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, rgba(102, 179, 255, 0.26), transparent 42%),
        linear-gradient(135deg, #101820, #1d2b3a);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .play-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(102, 179, 255, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #06111c;
      font-size: 1.7rem;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      padding-left: 4px;
    }

    .video-label {
      background: rgba(102, 179, 255, 0.88);
      color: #07111c;
      font-weight: 700;
    }

    .modal-content {
      background-color: #080808;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .modal-header {
      border-bottom-color: rgba(255, 255, 255, 0.14);
    }

    .media-stage {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.06), transparent 45%),
        #050505;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      padding: 12px;
    }

    .modal-media-img,
    .modal-media-video {
      max-width: 100%;
      max-height: 76vh;
      width: auto;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
    }

    .modal-media-video {
      width: 100%;
      max-width: 1100px;
      background-color: #000;
    }

    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 44px;
      height: 54px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.20);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 1.7rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-nav:hover {
      background: rgba(102, 179, 255, 0.78);
      color: #06111c;
    }

    .gallery-nav.prev {
      left: 14px;
    }

    .gallery-nav.next {
      right: 14px;
    }

    .media-caption {
      color: #d8d8d8;
      font-size: 0.92rem;
      margin-top: 12px;
    }

    .media-counter {
      color: #aaa;
      font-size: 0.86rem;
      margin-top: 4px;
    }

    .swipe-hint {
      color: #888;
      font-size: 0.78rem;
      margin-top: 4px;
    }

    a {
      color: #9ccfff;
    }

    @media (max-width: 576px) {
      .news-item {
        padding: 16px;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .gallery-item img,
      .video-placeholder {
        height: 135px;
      }

      .media-stage {
        min-height: 48vh;
        padding: 8px;
      }

      .gallery-nav {
        width: 38px;
        height: 48px;
        font-size: 1.4rem;
      }

      .gallery-nav.prev {
        left: 8px;
      }

      .gallery-nav.next {
        right: 8px;
      }
    }
  </style>
</head>

    let currentMediaIndex = 0;
    let galleryModalInstance = null;
    let touchStartX = 0;
    let touchEndX = 0;

    function createKsbOpenGallery() {
      return `
        <div class="gallery-grid">
          ${ksbOpenMedia.map((media, index) => {
            if (media.type === "image") {
              return `
                <button class="gallery-item" type="button" onclick="openGallery(${index})" aria-label="Open photo ${index + 1}">
                  <img
                    src="${media.thumb}"
                    data-full="${media.src}"
                    alt="${media.alt}"
                    loading="lazy"
                    decoding="async"
                    onerror="this.onerror=null; this.src=this.dataset.full;"
                  >
                  <div class="gallery-label">Photo ${index + 1}</div>
                </button>
              `;
            }

            return `
              <button class="gallery-item" type="button" onclick="openGallery(${index})" aria-label="Open video ${index - 13}">
                <div class="video-placeholder">
                  <div class="play-icon">&#9658;</div>
                </div>
                <div class="gallery-label video-label">Video ${index - 13}</div>
              </button>
            `;
          }).join("")}
        </div>
      `;
    }

    function openGallery(index) {
      currentMediaIndex = index;
      showMedia();

      if (!galleryModalInstance) {
        galleryModalInstance = new bootstrap.Modal(document.getElementById("galleryModal"));
      }

      galleryModalInstance.show();
    }

    function showMedia() {
      const media = ksbOpenMedia[currentMediaIndex];
      const container = document.getElementById("modalMediaContainer");
      const caption = document.getElementById("modalCaption");
      const counter = document.getElementById("modalCounter");

      stopCurrentVideo();

      if (media.type === "image") {
        container.innerHTML = `
          <img
            class="modal-media-img"
            src="${media.src}"
            alt="${media.alt}"
            decoding="async"
          >
        `;
      } else {
        container.innerHTML = `
          <video
            class="modal-media-video"
            controls
            autoplay
            playsinline
            preload="auto"
          >
            <source src="${media.src}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        `;
      }

      caption.textContent = galleryCaption;
      counter.textContent = `${currentMediaIndex + 1} of ${ksbOpenMedia.length}`;
    }

    function changeMedia(direction) {
      currentMediaIndex += direction;

      if (currentMediaIndex < 0) {
        currentMediaIndex = ksbOpenMedia.length - 1;
      }

      if (currentMediaIndex >= ksbOpenMedia.length) {
        currentMediaIndex = 0;
      }

      showMedia();
    }

    function stopCurrentVideo() {
      const existingVideo = document.querySelector("#modalMediaContainer video");

      if (existingVideo) {
        existingVideo.pause();
        existingVideo.removeAttribute("src");
        existingVideo.load();
      }
    }

    document.addEventListener("keydown", function (e) {
      const modalOpen = document.querySelector("#galleryModal.show");
      if (!modalOpen) return;

      if (e.key === "ArrowRight") {
        changeMedia(1);
      }

      if (e.key === "ArrowLeft") {
        changeMedia(-1);
      }
    });

    document.getElementById("galleryModal").addEventListener("hidden.bs.modal", function () {
      stopCurrentVideo();
      document.getElementById("modalMediaContainer").innerHTML = "";
    });

    document.getElementById("mediaStage").addEventListener("touchstart", function (e) {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.getElementById("mediaStage").addEventListener("touchend", function (e) {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;
      const minimumSwipeDistance = 50;

      if (Math.abs(swipeDistance) < minimumSwipeDistance) {
        return;
      }

      if (swipeDistance < 0) {
        changeMedia(1);
      } else {
        changeMedia(-1);
      }
    }
