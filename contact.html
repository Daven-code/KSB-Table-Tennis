<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - KSB Table Tennis Club</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { color: #f0f0f0; background-color: #121212; }
    body::before {
      content: "";
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background-color: rgba(18,18,18,0.85);
      z-index:-1;
    }

    .card { background-color: #1e1e1e; border: none; color: #f0f0f0; }
    .contact-info h4 { color: #f0f0f0; margin-top: 1rem; }
    .contact-info p { margin-bottom: 0.5rem; }

    iframe { width:100%; height:400px; border:0; margin-top:15px; }

    /* Kit link styling */
    .kit-link {
      display: inline-block;
      margin-top: 0.25rem;
      padding: 10px 14px;
      border-radius: 8px;
      background: #66b3ff;
      color: #121212;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .kit-link:hover { opacity: 0.9; transform: translateY(-1px); color: #121212; }
    .kit-note { color: #bbb; font-size: 0.95rem; margin-top: 0.4rem; }
  </style>
</head>

<body>

  <!-- Navbar automatically inserted by site-utils.js -->

  <div class="container my-5" style="max-width:900px;">
    <h1 class="mb-4">Contact Us</h1>

    <div class="contact-info">
      <h4>Venue:</h4>
      <p>Kay Street Baptist Church, Rossendale BB4 7LS</p>

      <h4>Email:</h4>
      <p><a href="mailto:elks43@talk21.com">elks43@talk21.com</a></p>

      <h4>Phone:</h4>
      <p>07981 387755</p>

      <!-- ✅ New: Club Kit section -->
      <h4>Club Kit:</h4>
      <a
        class="kit-link"
        href="https://clubshop.macron.com/manchester/ksb-table-tennis/kit-top-up"
        target="_blank"
        rel="noopener noreferrer"
      >
        Order KSB Club Kit (Macron)
      </a>
    </div>

    <!-- Map -->
    <div class="mt-4">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2361.921187299844!2d-2.286671423015137!3d53.70185024806404!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x487ba2b327fef047%3A0xed8cf9ff8d965ccf!2sKay%20Street%20Baptist%20Church!5e0!3m2!1sen!2suk!4v1758537113189!5m2!1sen!2suk"
        width="100%"
        height="450"
        style="border:0;"
        allowfullscreen=""
        loading="lazy">
      </iframe>
    </div>
  </div>

  <script src="site-utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
